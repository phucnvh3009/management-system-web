<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="login-container">
        <!-- Logo Icon 'M' -->
        <div class="text-center mb-3">
            <div class="brand-logo-circle mx-auto">M</div>
            <h2 class="fw-bold mt-3 mb-1">Welcome Back!</h2>
            <p class="text-muted small">Sign in to continue to your account.</p>
        </div>

        <!-- Login Card -->
        <div class="card login-card shadow-sm border-0">
            <div class="card-body p-4">
                <h4 class="fw-bold mb-1">Login to your account</h4>
                <p class="text-muted small mb-4">Enter your email and password to get started.</p>

                <!-- Form Đăng Nhập -->
                <form id="loginForm">
                    <!-- Email Field -->
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>

                    <!-- Password Field + Toggle Show/Hide -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label small fw-semibold">Password</label>
                            <a href="#" class="text-decoration-none small text-muted">Forgot password?</a>
                        </div>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" placeholder="Enter your password"
                                required>
                            <button class="btn btn-outline-secondary" type="button" id="btnTogglePassword">Show</button>
                        </div>
                    </div>

                    <!-- Remember Me Checkbox -->
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold btn-purple">Sign In</button>
                </form>

                <!-- Link sang Create Account -->
                <div class="text-center mt-4 small">
                    <span class="text-muted">Don't have an account? </span>
                    <a href="#" class="text-decoration-none fw-semibold link-purple">Create an account</a>
                </div>
            </div>
        </div>

        <p class="text-center text-muted small mt-4">&copy; 2026 My Website. All rights reserved.</p>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- File JS chung -->
    <script src="script.js"></script>
</body>

</html>
